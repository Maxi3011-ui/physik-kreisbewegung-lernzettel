<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="disabled-adaptations" content="watch">
<meta name="theme-color" content="#0d0f12">
<title>Physik</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237cc4ff'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%230d0f12' stroke-width='5'/%3E%3Ccircle cx='49' cy='32' r='6' fill='%230d0f12'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0f12;
    --panel: #181b20;
    --panel2: #20242b;
    --line: #2a2f37;
    --ink: #f2f2ee;
    --muted: #8d939c;
    --acc: #7cc4ff;
    --gold: #e8a33d;
    --green: #6ad19a;
    --red: #ff6b5e;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px; line-height: 1.35;
  }
  .shell { max-width: 520px; margin: 0 auto; padding: 0 16px 40px; }
  sub, sup { font-size: 0.68em; line-height: 0; }

  nav.tabs {
    position: sticky; top: 0; z-index: 5;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    padding: 10px 0; background: var(--bg);
  }
  nav.tabs a {
    display: flex; align-items: center; justify-content: center;
    min-height: 44px; border-radius: 12px; text-decoration: none;
    background: var(--panel); color: var(--muted);
    font-size: 0.9rem; font-weight: 700;
  }
  nav.tabs a[aria-current="true"] { background: var(--acc); color: #0d0f12; }

  section[hidden] { display: none; }
  h2 { margin: 18px 0 8px; font-size: 1.3rem; line-height: 1.15; }
  h2:first-child { margin-top: 6px; }
  h3 { margin: 14px 0 6px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

  /* Kategorien */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tiles a {
    display: flex; flex-direction: column; gap: 4px; padding: 12px;
    border-radius: 14px; background: var(--panel); color: var(--ink); text-decoration: none;
    min-height: 96px;
  }
  .tiles a .i { font-size: 1.6rem; line-height: 1; }
  .tiles a b { font-size: 1rem; line-height: 1.15; }
  .tiles a small { color: var(--muted); font-size: 0.78rem; line-height: 1.2; }

  /* Aufgabenliste */
  .list a {
    display: block; padding: 11px 12px; margin-bottom: 7px; border-radius: 12px;
    background: var(--panel); color: var(--ink); text-decoration: none;
  }
  .list a b { display: block; font-size: 1rem; line-height: 1.2; }
  .list a small { display: block; margin-top: 3px; color: var(--muted); font-size: 0.8rem; line-height: 1.25; }
  .back {
    display: inline-flex; align-items: center; gap: 4px; margin: 4px 0 2px;
    color: var(--acc); text-decoration: none; font-weight: 700; font-size: 0.9rem;
  }

  /* Lösungskarte */
  .card { background: var(--panel); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
  .tag { color: var(--muted); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .erk { font-size: 0.92rem; }
  .formel { font-size: 1.35rem; font-weight: 700; color: var(--gold); line-height: 1.3; }
  .formel + .formel { margin-top: 4px; }
  .formel.s { font-size: 1.05rem; color: var(--ink); }
  .idee { font-size: 0.92rem; margin-top: 6px; }
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .inputs label { display: flex; flex-direction: column; gap: 3px; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .inputs input {
    width: 100%; padding: 8px 9px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--ink); font: inherit; font-size: 1rem; font-weight: 700;
  }
  .inputs input:focus { outline: 2px solid var(--acc); border-color: transparent; }
  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  ol.steps li {
    counter-increment: s; display: grid; grid-template-columns: 1.6em 1fr; gap: 6px;
    padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 0.98rem;
  }
  ol.steps li:last-child { border-bottom: 0; }
  ol.steps li::before { content: counter(s) "."; color: var(--muted); font-weight: 700; }
  .res { margin-top: 4px; padding: 10px 12px; border-radius: 12px; background: rgba(106,209,154,0.13); color: var(--green); font-weight: 800; font-size: 1.1rem; }
  .res span { display: block; }
  .hint { color: var(--muted); font-size: 0.85rem; }

  /* Formeln */
  .row {
    display: grid; grid-template-columns: 40% 1fr; gap: 8px; align-items: baseline;
    padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .p { color: var(--muted); font-size: 0.85rem; }
  .f { font-weight: 700; font-size: 1.05rem; }
  .f b { color: var(--gold); }
  .card.rows { padding: 2px 12px; }
  .jump { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 6px 0 4px; }
  .jump a {
    display: block; padding: 8px 2px; border-radius: 10px; background: var(--panel);
    color: var(--ink); text-align: center; text-decoration: none; font-weight: 700; font-size: 0.78rem; line-height: 1.15;
  }
  [id^="f-"], [id^="w-"] { scroll-margin-top: 70px; }

  /* Wissen */
  details { background: var(--panel); border-radius: 12px; margin-bottom: 7px; }
  details summary {
    list-style: none; cursor: pointer; padding: 10px 12px; font-weight: 700; font-size: 0.98rem;
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "+"; color: var(--acc); font-size: 1.2rem; }
  details[open] summary::after { content: "–"; }
  details .a { padding: 0 12px 11px; font-size: 0.95rem; }
  details .a ul { margin: 0; padding-left: 1.1em; }
  details .a li { margin: 3px 0; }
  .pdf { display: block; margin-top: 14px; padding: 12px; border-radius: 12px; background: var(--panel); color: var(--acc); text-decoration: none; font-weight: 700; text-align: center; }

  @media (max-width: 230px) {
    body { font-size: 15px; }
    .shell { padding: 0 3px 24px; }
    nav.tabs { gap: 3px; padding: 4px 0 6px; }
    nav.tabs a { min-height: 34px; border-radius: 9px; font-size: 0.72rem; }
    nav.tabs .e { display: none; }
    h2 { margin: 10px 0 5px; font-size: 1.05rem; }
    h3 { font-size: 0.68rem; margin: 10px 0 4px; }
    .tiles { gap: 4px; }
    .tiles a { padding: 7px; min-height: 0; border-radius: 10px; gap: 2px; }
    .tiles a .i { font-size: 1.15rem; }
    .tiles a b { font-size: 0.8rem; }
    .tiles a small { display: none; }
    .list a { padding: 7px 8px; margin-bottom: 5px; border-radius: 9px; }
    .list a b { font-size: 0.86rem; }
    .list a small { font-size: 0.68rem; }
    .card { padding: 6px 7px; border-radius: 10px; margin-bottom: 7px; }
    .card.rows { padding: 2px 7px; }
    .formel { font-size: 1.05rem; }
    .formel.s { font-size: 0.92rem; }
    .erk, .idee { font-size: 0.82rem; }
    .inputs { grid-template-columns: 1fr; gap: 4px; }
    .inputs label { font-size: 0.68rem; }
    .inputs input { padding: 4px 6px; font-size: 0.9rem; }
    ol.steps li { font-size: 0.82rem; grid-template-columns: 1.3em 1fr; gap: 3px; padding: 5px 0; }
    .res { font-size: 0.92rem; padding: 6px 7px; }
    .row { grid-template-columns: 1fr; gap: 0; padding: 5px 0; }
    .p { font-size: 0.7rem; }
    .f { font-size: 0.95rem; }
    .jump { grid-template-columns: repeat(2, 1fr); gap: 3px; }
    .jump a { padding: 6px 2px; font-size: 0.68rem; border-radius: 7px; }
    details summary { padding: 7px 8px; font-size: 0.84rem; }
    details .a { padding: 0 8px 8px; font-size: 0.82rem; }
  }
</style>
</head>
<body>
<main class="shell">
  <nav class="tabs">
    <a href="#aufgabe" data-tab="aufgabe"><span class="e">🎯 </span>Aufgabe</a>
    <a href="#formeln" data-tab="formeln"><span class="e">∑ </span>Formeln</a>
    <a href="#wissen" data-tab="wissen"><span class="e">💡 </span>Wissen</a>
  </nav>
  <section id="aufgabe"></section>
  <section id="formeln" hidden></section>
  <section id="wissen" hidden></section>
</main>

<script>
// ---------- Konstanten ----------
const G = 6.674e-11, ME = 5.97e24, RE = 6.37e6, g0 = 9.81, PI = Math.PI;

// ---------- Zahlen ----------
function fmt(x, d = 3) {
  if (!isFinite(x)) return '–';
  const a = Math.abs(x);
  if (a !== 0 && (a >= 1e6 || a < 1e-2)) {
    let e = Math.floor(Math.log10(a));
    let m = +(x / Math.pow(10, e)).toPrecision(d);
    if (Math.abs(m) >= 10) { m /= 10; e++; }
    return String(m).replace('.', ',') + '·10<sup>' + e + '</sup>';
  }
  const s = +x.toPrecision(d);
  const [i, f] = String(Math.abs(s)).split('.');
  const ig = i.length > 4 ? i.replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') : i;
  return (s < 0 ? '−' : '') + ig + (f ? ',' + f : '');
}
const u = (x, unit, d) => fmt(x, d) + (unit ? ' ' + unit : '');
function parse(s) {
  s = String(s).trim().replace(/\s/g, '').replace(/−/g, '-').replace(',', '.')
    .replace(/[·x*]10\^?/i, 'e');
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}

// ---------- Aufgabentypen ----------
const KATS = [
  { id: 'dreh', i: '🔄', t: 'Drehen', s: 'Umdrehungen, T, f, ω, Tempo auf der Kreisbahn' },
  { id: 'kraft', i: '🚗', t: 'Kurve & Kraft', s: 'Zentripetalkraft, Kurve, Faden' },
  { id: 'loop', i: '🎢', t: 'Looping', s: 'Senkrechter Kreis, oben / unten' },
  { id: 'grav', i: '🌍', t: 'Gravitation', s: 'Massen ziehen sich an, g, Planetenmasse' },
  { id: 'sat', i: '🛰️', t: 'Satellit', s: 'Umlaufbahn, geostationär, Höhe' },
  { id: 'was', i: '⚖️', t: 'Was passiert, wenn …', s: 'Verdoppeln, halbieren, ohne Rechnen' }
];

const TYPES = [
  // ---- Drehen ----
  { id: 'umdrehungen', k: 'dreh', t: 'Umlaufzeit, Frequenz, ω',
    erk: '„n Umdrehungen in t Sekunden“, „Drehzahl in U/min“, „wie lange dauert eine Runde?“',
    f: ['T = t / n', 'f = 1/T', 'ω = 2π/T'],
    idee: 'T = Zeit für <b>eine</b> Runde. U/min → durch 60 teilen = f in Hz.',
    in: [['n', 'Umdrehungen n', '', 12], ['t', 'Zeit t', 's', 60]],
    solve: v => {
      const T = v.t / v.n, f = 1 / T, w = 2 * PI / T;
      return { steps: [
        `T = t/n = ${u(v.t, 's')} / ${fmt(v.n)} = <b>${u(T, 's')}</b>`,
        `f = 1/T = 1/${u(T, 's')} = <b>${u(f, 'Hz')}</b>`,
        `ω = 2π/T = 2π/${u(T, 's')} = <b>${u(w, '1/s')}</b>`
      ], res: [`T = ${u(T, 's')}`, `f = ${u(f, 'Hz')}`, `ω = ${u(w, '1/s')}`] };
    } },
  { id: 'bahngeschw', k: 'dreh', t: 'Bahngeschwindigkeit v',
    erk: '„Wie schnell bewegt sich ein Punkt am Rand / ein Fahrgast?“ – Radius und Umlaufzeit gegeben',
    f: ['v = 2πr / T', 'v = ω · r'],
    idee: 'Eine Runde = Kreisumfang 2πr in der Zeit T.',
    in: [['r', 'Radius r', 'm', 4], ['T', 'Umlaufzeit T', 's', 5]],
    solve: v => {
      const vv = 2 * PI * v.r / v.T, w = 2 * PI / v.T;
      return { steps: [
        `Umfang s = 2πr = 2π · ${u(v.r, 'm')} = ${u(2 * PI * v.r, 'm')}`,
        `v = 2πr/T = ${u(2 * PI * v.r, 'm')} / ${u(v.T, 's')} = <b>${u(vv, 'm/s')}</b>`,
        `In km/h: · 3,6 = ${u(vv * 3.6, 'km/h')}`,
        `Kontrolle: ω = 2π/T = ${u(w, '1/s')}; ω·r = ${u(w * v.r, 'm/s')} ✓`
      ], res: [`v = ${u(vv, 'm/s')} = ${u(vv * 3.6, 'km/h')}`] };
    } },
  { id: 'omega-v-r', k: 'dreh', t: 'ω, v oder r gesucht',
    erk: 'Zwei der drei Größen v, ω, r sind gegeben, die dritte ist gesucht',
    f: ['v = ω · r', 'ω = v / r', 'r = v / ω'],
    idee: 'Danach folgt T = 2π/ω.',
    in: [['v', 'Bahngeschw. v', 'm/s', 5], ['r', 'Radius r', 'm', 2]],
    solve: v => {
      const w = v.v / v.r, T = 2 * PI / w;
      return { steps: [
        `ω = v/r = ${u(v.v, 'm/s')} / ${u(v.r, 'm')} = <b>${u(w, '1/s')}</b>`,
        `T = 2π/ω = 2π / ${u(w, '1/s')} = <b>${u(T, 's')}</b>`,
        `f = 1/T = ${u(1 / T, 'Hz')}`
      ], res: [`ω = ${u(w, '1/s')}`, `T = ${u(T, 's')}`] };
    } },
  { id: 'zwei-punkte', k: 'dreh', t: 'Zwei Punkte auf derselben Scheibe',
    erk: 'Karussell innen/außen, CD, Rad: „Welcher Punkt ist schneller?“',
    f: ['ω₁ = ω₂ (gleiche Scheibe)', 'v = ω · r → v ∼ r'],
    idee: 'Gleiche Umlaufzeit für alle Punkte. Doppelter Radius → doppelte Bahngeschwindigkeit.',
    in: [['r1', 'Radius innen r₁', 'm', 2], ['r2', 'Radius außen r₂', 'm', 4], ['T', 'Umlaufzeit T', 's', 5]],
    solve: v => {
      const w = 2 * PI / v.T, v1 = w * v.r1, v2 = w * v.r2;
      return { steps: [
        `ω = 2π/T = ${u(w, '1/s')} – gilt für beide Punkte`,
        `v₁ = ω · r₁ = ${u(w, '1/s')} · ${u(v.r1, 'm')} = <b>${u(v1, 'm/s')}</b>`,
        `v₂ = ω · r₂ = ${u(w, '1/s')} · ${u(v.r2, 'm')} = <b>${u(v2, 'm/s')}</b>`,
        `v₂/v₁ = r₂/r₁ = ${fmt(v.r2 / v.r1)}`
      ], res: [`v₁ = ${u(v1, 'm/s')}`, `v₂ = ${u(v2, 'm/s')}`, `ω gleich: ${u(w, '1/s')}`] };
    } },
  { id: 'erde-dreht', k: 'dreh', t: 'Punkt auf der rotierenden Erde',
    erk: '„Wie schnell bewegt sich ein Punkt am Äquator / in München?“',
    f: ['r = R<sub>E</sub> · cos φ', 'v = 2πr / T', 'T = 24 h = 86 400 s'],
    idee: 'φ = geografische Breite. Am Äquator φ = 0° → r = R<sub>E</sub> = 6370 km; am Pol v = 0.',
    in: [['phi', 'Breite φ', '°', 0]],
    solve: v => {
      const r = RE * Math.cos(v.phi * PI / 180), vv = 2 * PI * r / 86400;
      return { steps: [
        `r = R<sub>E</sub> · cos ${fmt(v.phi)}° = 6,37·10<sup>6</sup> m · ${fmt(Math.cos(v.phi * PI / 180))} = ${u(r, 'm')}`,
        `v = 2πr/T = 2π · ${u(r, 'm')} / 86 400 s = <b>${u(vv, 'm/s')}</b>`,
        `= ${u(vv * 3.6, 'km/h')}`,
        `ω = 2π/T = 7,27·10<sup>−5</sup> 1/s (überall gleich)`
      ], res: [`v = ${u(vv, 'm/s')} = ${u(vv * 3.6, 'km/h')}`] };
    } },

  // ---- Kurve & Kraft ----
  { id: 'fzp-v', k: 'kraft', t: 'Zentripetalkraft aus v',
    erk: 'Masse, Geschwindigkeit und Radius gegeben: „Welche Kraft ist nötig, damit … auf der Kreisbahn bleibt?“',
    f: ['F<sub>zp</sub> = m · v² / r', 'a<sub>zp</sub> = v² / r'],
    idee: 'km/h erst ÷ 3,6 in m/s umrechnen! F<sub>zp</sub> zeigt zum Kreismittelpunkt.',
    in: [['m', 'Masse m', 'kg', 1200], ['vk', 'Tempo v', 'km/h', 72], ['r', 'Radius r', 'm', 50]],
    solve: v => {
      const vv = v.vk / 3.6, F = v.m * vv * vv / v.r;
      return { steps: [
        `v = ${u(v.vk, 'km/h')} ÷ 3,6 = ${u(vv, 'm/s')}`,
        `F<sub>zp</sub> = m·v²/r = ${u(v.m, 'kg')} · (${u(vv, 'm/s')})² / ${u(v.r, 'm')} = <b>${u(F, 'N')}</b>`,
        `a<sub>zp</sub> = v²/r = ${u(vv * vv / v.r, 'm/s²')}`
      ], res: [`F<sub>zp</sub> = ${u(F, 'N')}`, `a<sub>zp</sub> = ${u(vv * vv / v.r, 'm/s²')}`] };
    } },
  { id: 'fzp-t', k: 'kraft', t: 'Zentripetalkraft aus Umlaufzeit',
    erk: 'Kettenkarussell, Zentrifuge, Hammerwerfer: Umlaufzeit oder Drehzahl statt Tempo gegeben',
    f: ['ω = 2π / T', 'F<sub>zp</sub> = m · ω² · r'],
    idee: 'Erst ω ausrechnen, dann einsetzen.',
    in: [['m', 'Masse m', 'kg', 60], ['r', 'Radius r', 'm', 5], ['T', 'Umlaufzeit T', 's', 4]],
    solve: v => {
      const w = 2 * PI / v.T, F = v.m * w * w * v.r;
      return { steps: [
        `ω = 2π/T = 2π / ${u(v.T, 's')} = ${u(w, '1/s')}`,
        `F<sub>zp</sub> = m·ω²·r = ${u(v.m, 'kg')} · (${u(w, '1/s')})² · ${u(v.r, 'm')} = <b>${u(F, 'N')}</b>`,
        `Tempo: v = ω·r = ${u(w * v.r, 'm/s')}`
      ], res: [`F<sub>zp</sub> = ${u(F, 'N')}`] };
    } },
  { id: 'kurve', k: 'kraft', t: 'Höchsttempo in der Kurve',
    erk: '„Wie schnell darf das Auto höchstens durch die Kurve fahren?“ – Haftreibungszahl μ gegeben',
    f: ['F<sub>R</sub> = μ · m · g', 'm·v²/r = μ·m·g', 'v<sub>max</sub> = √(μ · g · r)'],
    idee: 'Haftreibung liefert die Zentripetalkraft. Die Masse kürzt sich weg!',
    in: [['mu', 'Haftreibung μ', '', 0.8], ['r', 'Radius r', 'm', 50]],
    solve: v => {
      const vv = Math.sqrt(v.mu * g0 * v.r);
      return { steps: [
        `Ansatz: F<sub>zp</sub> = F<sub>R</sub> → m·v²/r = μ·m·g`,
        `m kürzen: v² = μ·g·r = ${fmt(v.mu)} · 9,81 m/s² · ${u(v.r, 'm')} = ${u(vv * vv, 'm²/s²')}`,
        `v<sub>max</sub> = √(${fmt(vv * vv)}) = <b>${u(vv, 'm/s')}</b> = ${u(vv * 3.6, 'km/h')}`
      ], res: [`v<sub>max</sub> = ${u(vv, 'm/s')} = ${u(vv * 3.6, 'km/h')}`] };
    } },
  { id: 'faden', k: 'kraft', t: 'Faden reißt – Höchsttempo',
    erk: '„Der Faden hält höchstens F … Wie schnell darf der Körper kreisen?“ (waagrecht)',
    f: ['F<sub>Faden</sub> = F<sub>zp</sub> = m·v²/r', 'v<sub>max</sub> = √(F<sub>max</sub> · r / m)'],
    idee: 'Reißt der Faden, fliegt der Körper tangential (geradeaus) weiter.',
    in: [['m', 'Masse m', 'kg', 0.5], ['r', 'Fadenlänge r', 'm', 0.8], ['F', 'Reißkraft F<sub>max</sub>', 'N', 50]],
    solve: v => {
      const vv = Math.sqrt(v.F * v.r / v.m), T = 2 * PI * v.r / vv;
      return { steps: [
        `Ansatz: F<sub>max</sub> = m·v²/r → v² = F·r/m`,
        `v² = ${u(v.F, 'N')} · ${u(v.r, 'm')} / ${u(v.m, 'kg')} = ${u(vv * vv, 'm²/s²')}`,
        `v<sub>max</sub> = <b>${u(vv, 'm/s')}</b>`,
        `Kürzeste Umlaufzeit T = 2πr/v = ${u(T, 's')}`
      ], res: [`v<sub>max</sub> = ${u(vv, 'm/s')}`, `T<sub>min</sub> = ${u(T, 's')}`] };
    } },
  { id: 'radius', k: 'kraft', t: 'Radius oder Masse gesucht',
    erk: 'F<sub>zp</sub> ist gegeben, gesucht ist r („Wie eng darf die Kurve sein?“) oder m',

// ---------- Rendering ----------
const $ = s => document.querySelector(s);
const kat = id => KATS.find(k => k.id === id);

function renderAufgabe(parts) {
  const el = $('#aufgabe');
  const [, katId, typId] = parts;
  if (typId) { renderTyp(el, TYPES.find(t => t.id === typId)); return; }
  if (katId) {
    const k = kat(katId);
    if (katId === 'was') {
      el.innerHTML = `<a class="back" href="#aufgabe">‹ Kategorien</a><h2>${k.i} ${k.t}</h2>
        <div class="card rows">${WAS.map(([a, b]) => `<div class="row"><div class="p">${a}</div><div class="f">${b}</div></div>`).join('')}</div>`;
      return;
    }
    el.innerHTML = `<a class="back" href="#aufgabe">‹ Kategorien</a><h2>${k.i} ${k.t}</h2>
      <div class="list">${TYPES.filter(t => t.k === katId).map(t =>
        `<a href="#aufgabe/${katId}/${t.id}"><b>${t.t}</b><small>${t.erk}</small></a>`).join('')}</div>`;
    return;
  }
  el.innerHTML = `<h2>Worum geht’s in der Aufgabe?</h2>
    <div class="tiles">${KATS.map(k =>
      `<a href="#aufgabe/${k.id}"><span class="i">${k.i}</span><b>${k.t}</b><small>${k.s}</small></a>`).join('')}</div>`;
}

function renderTyp(el, t) {
  if (!t) { location.hash = '#aufgabe'; return; }
  const k = kat(t.k);
  el.innerHTML = `<a class="back" href="#aufgabe/${t.k}">‹ ${k.t}</a>
    <h2>${t.t}</h2>
    <div class="card"><div class="tag">Erkennst du an</div><div class="erk">${t.erk}</div></div>
    <div class="card"><div class="tag">Formel</div>${t.f.map((x, i) => `<div class="formel${i && t.f.length > 2 ? ' s' : ''}">${x}</div>`).join('')}
      <div class="idee">${t.idee}</div></div>
    <div class="card"><div class="tag">Gegeben (änderbar)</div><div class="inputs">${t.in.map(([key, lab, unit, def]) =>
      `<label>${lab}${unit ? ' [' + unit + ']' : ''}<input inputmode="decimal" autocomplete="off" data-k="${key}" value="${String(def).replace('.', ',')}"></label>`).join('')}</div></div>
    <div class="card"><div class="tag">Lösungsweg</div><div id="out"></div></div>`;
  const run = () => {
    const v = {}; let ok = true;
    el.querySelectorAll('input[data-k]').forEach(i => { v[i.dataset.k] = parse(i.value); if (isNaN(v[i.dataset.k])) ok = false; });
    const out = $('#out');
    if (!ok) { out.innerHTML = '<div class="hint">Zahl eingeben, z. B. 5,97e24 für 5,97·10²⁴</div>'; return; }
    const r = t.solve(v);
    out.innerHTML = `<ol class="steps">${r.steps.map(s => `<li><div>${s}</div></li>`).join('')}</ol>
      <div class="res">${r.res.map(s => `<span>${s}</span>`).join('')}</div>`;
  };
  el.addEventListener('input', run);
  run();
}

function renderFormeln() {
  $('#formeln').innerHTML = `<div class="jump">${FORMELN.map(([id, t]) => `<a href="#${id}">${t}</a>`).join('')}</div>` +
    FORMELN.map(([id, t, rows]) => `<h2 id="${id}">${t}</h2><div class="card rows">${rows.map(([p, f]) =>
      `<div class="row"><div class="p">${p}</div><div class="f">${f}</div></div>`).join('')}</div>`).join('') +
    `<a class="pdf" href="a4-formelblatt.pdf">📄 A4-Formelblatt (PDF)</a>`;
}

function renderWissen() {
  $('#wissen').innerHTML = `<div class="jump">${WISSEN.map(([id, t]) => `<a href="#${id}">${t}</a>`).join('')}</div>` +
    WISSEN.map(([id, t, qs]) => `<h2 id="${id}">${t}</h2>${qs.map(([q, a]) =>
      `<details><summary><span>${q}</span></summary><div class="a">${a}</div></details>`).join('')}`).join('');
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'aufgabe';
  let tab = h.split('/')[0];
  let anchor = null;
  if (tab.startsWith('f-')) { anchor = tab; tab = 'formeln'; }
  else if (tab.startsWith('w-')) { anchor = tab; tab = 'wissen'; }
  if (!['aufgabe', 'formeln', 'wissen'].includes(tab)) tab = 'aufgabe';
  document.querySelectorAll('section').forEach(s => s.hidden = s.id !== tab);
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === tab));
  if (tab === 'aufgabe') {
    const old = $('#aufgabe'); const fresh = old.cloneNode(false); old.replaceWith(fresh);
    renderAufgabe(h.split('/'));
    window.scrollTo(0, 0);
  } else if (anchor) {
    const t = document.getElementById(anchor); if (t) t.scrollIntoView();
  } else window.scrollTo(0, 0);
}

renderFormeln();
renderWissen();
window.addEventListener('hashchange', route);
route();
</script>
